<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>简单 Demo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f6d365, #fda085);
      color: #222;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
      padding: 32px 40px;
      text-align: center;
      width: min(90vw, 420px);
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
    }

    button {
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 16px;
    }

    button:hover {
      background: #ff4d4d;
    }

    #count {
      font-size: 2.5rem;
      font-weight: bold;
      margin: 18px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>你好，世界！</h1>
    <div id="count">0</div>
    <button id="btn">点击加一</button>
  </div>

  <script>
    const countEl = document.getElementById('count');
    const btn = document.getElementById('btn');
    let count = 0;

    btn.addEventListener('click', () => {
      count += 1;
      countEl.textContent = count;
    });
  </script>
</body>
</html>
