<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>点击挑战</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1f2a44, #3a5f7a, #46b0b3);
      color: #fff;
    }

    .game {
      width: min(92vw, 560px);
      background: rgba(8, 16, 36, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
      padding: 24px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      font-size: 1.1rem;
    }

    .score {
      font-weight: bold;
      color: #ffd166;
    }

    .time {
      font-weight: bold;
      color: #90f1ef;
    }

    .arena {
      position: relative;
      width: 100%;
      height: 360px;
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      border-radius: 16px;
      border: 2px solid rgba(255,255,255,0.15);
      overflow: hidden;
      cursor: crosshair;
    }

    .target {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff7d6 0%, #ffd166 18%, #ff8c42 60%, #ff5d5d 100%);
      border: 4px solid rgba(255,255,255,0.8);
      box-shadow: 0 0 25px rgba(255, 140, 66, 0.8);
      transform: translate(-50%, -50%);
      transition: left 0.18s ease, top 0.18s ease, transform 0.12s ease;
      user-select: none;
    }

    .target:active {
      transform: translate(-50%, -50%) scale(0.92);
    }

    .target::before,
    .target::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.8);
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
    }

    .target::before {
      width: 2px;
      height: 32px;
    }

    .target::after {
      width: 32px;
      height: 2px;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      gap: 12px;
    }

    #status {
      color: #dff6ff;
      font-size: 0.95rem;
      flex: 1;
      min-height: 20px;
    }

    button {
      background: linear-gradient(135deg, #ff9f43, #ff6b6b);
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    @media (max-width: 480px) {
      .game {
        padding: 18px;
      }

      .arena {
        height: 300px;
      }

      .controls {
        flex-direction: column;
        align-items: stretch;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="game">
    <div class="topbar">
      <div class="score">分数：<span id="score">0</span></div>
      <div class="time">时间：<span id="time">30</span>s</div>
    </div>

    <div class="arena" id="arena">
      <div class="target" id="target" aria-label="目标"></div>
    </div>

    <div class="controls">
      <div id="status">点击开始，尽快点中目标！</div>
      <button id="startBtn">开始游戏</button>
    </div>
  </div>

  <script>
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const target = document.getElementById('target');
    const arena = document.getElementById('arena');
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');

    let score = 0;
    let timeLeft = 30;
    let timer = null;
    let gameRunning = false;

    function updateDisplay() {
      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;
    }

    function moveTarget() {
      const maxX = arena.clientWidth - 70;
      const maxY = arena.clientHeight - 70;
      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      target.style.left = x + 'px';
      target.style.top = y + 'px';
    }

    function endGame() {
      gameRunning = false;
      clearInterval(timer);
      statusEl.textContent = '游戏结束！你的得分是 ' + score + ' 分。';
      startBtn.textContent = '再玩一次';
    }

    function startGame() {
      score = 0;
      timeLeft = 30;
      gameRunning = true;
      startBtn.textContent = '游戏中';
      statusEl.textContent = '开始！快点点击目标！';
      updateDisplay();
      moveTarget();

      clearInterval(timer);
      timer = setInterval(() => {
        timeLeft -= 1;
        updateDisplay();

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    startBtn.addEventListener('click', () => {
      if (!gameRunning) {
        startGame();
      }
    });

    target.addEventListener('click', () => {
      if (!gameRunning) return;

      score += 1;
      updateDisplay();
      statusEl.textContent = '命中！继续加油！';
      moveTarget();
    });

    updateDisplay();
  </script>
</body>
</html>
